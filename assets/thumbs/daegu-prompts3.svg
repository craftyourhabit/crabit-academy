<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <!-- 자료/인사이트 썸네일 표준 템플릿:
       연회색 배경 + 좌측 영단어 라벨과 타이틀 + 우측 큼직한 일러스트.
       장식 원형, 하단 캡션은 절대 넣지 않는다. -->
  <rect width="800" height="450" fill="#F9FAFC"/>
  <!-- 겹쳐 쌓인 프롬프트 카드 -->
  <g transform="translate(474 96) rotate(6)">
    <rect x="0" y="0" width="240" height="288" rx="20" fill="#E8E8E8"/>
  </g>
  <g transform="translate(494 84) rotate(-3)">
    <rect x="0" y="0" width="240" height="288" rx="20" fill="#FFFFFF" stroke="#E8E8E8"/>
    <rect x="30" y="34" width="88" height="27" rx="13.5" fill="#FEE9F4"/>
    <rect x="30" y="88" width="180" height="12" rx="6" fill="#16192A"/>
    <rect x="30" y="115" width="146" height="12" rx="6" fill="#B9BABF"/>
    <rect x="30" y="142" width="170" height="12" rx="6" fill="#B9BABF"/>
    <rect x="30" y="169" width="117" height="12" rx="6" fill="#FB75BB"/>
    <rect x="30" y="215" width="180" height="42" rx="12" fill="#16192A"/>
    <rect x="72" y="231" width="97" height="10" rx="5" fill="#FFFFFF"/>
  </g>
  <text x="64" y="130" font-size="20" letter-spacing="5" fill="#7F808A" font-weight="600">PROMPTS</text>
  <text x="64" y="230" font-size="52" fill="#16192A" font-weight="700">복사해서 쓰는</text>
  <text x="64" y="298" font-size="52" fill="#16192A" font-weight="700">실습 <tspan fill="#FB75BB">프롬프트 3종</tspan></text>
</svg>
