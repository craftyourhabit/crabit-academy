<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>결제 완료 - 크래빗 아카데미</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../assets/favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --bg: #FFFFFF; --fill-soft: #F9FAFC; --ink: #16192A;
    --muted: rgba(22, 25, 42, 0.55); --line: #E8E8E8; --pink: #FB75BB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.65; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 64px 20px 80px; }
  .mark {
    width: 56px; height: 56px; border-radius: 50%; background: var(--fill-soft);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 28px; }
  .box { border: 1px solid var(--line); border-radius: 11px; background: var(--fill-soft); padding: 20px 22px; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; font-size: 14px; }
  .row span { color: var(--muted); flex: none; }
  .row b { font-weight: 600; text-align: right; word-break: break-all; }
  .row.total b { font-size: 17px; font-weight: 700; }
  .access h3 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .access a { color: var(--ink); font-weight: 600; }
  .note { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
  .btns { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 13px 22px; border-radius: 10px; font-size: 15px;
    font-weight: 600; text-decoration: none; border: 1px solid var(--line);
    color: var(--ink); background: #fff;
  }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #333333; }
  .btn:not(.primary):hover { background: #F0F0F0; }
  .err { color: #C0392B; }
  .spin {
    width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--pink);
    border-radius: 50%; animation: sp 0.8s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap" id="main">
  <div class="mark"><div class="spin"></div></div>
  <h1>결제를 확인하고 있어요</h1>
  <p class="sub">잠시만 기다려 주세요. 창을 닫지 마세요.</p>
</div>

<script>
/* ===============================================
   결제 완료 페이지

   카카오페이에서 결제 인증을 마치면 pg_token을 붙여 여기로 돌아옵니다.
   이 페이지는 그 토큰을 결제 함수(pay/approve)에 넘겨 승인을 확정하고,
   승인이 되면 시청 안내를 바로 보여줍니다.

   승인 확정 전에는 돈이 빠져나가지 않습니다. 그래서 이 페이지에 오기 전에
   창이 닫혀도 결제는 일어나지 않은 상태입니다.
   =============================================== */
(function () {
  var PAY_API = "https://iwitqfnhlyseuxxndvny.supabase.co/functions/v1/pay";
  var q = new URLSearchParams(location.search);
  var oid = q.get("oid");
  var pgToken = q.get("pg_token");
  var main = document.getElementById("main");
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };

  var CHECK = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FB75BB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var CROSS = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  function fail(msgHtml) {
    main.innerHTML = '<div class="mark">' + CROSS + '</div>'
      + '<h1>결제를 확인하지 못했어요</h1>'
      + '<p class="sub err">' + msgHtml + '</p>'
      + '<div class="btns">'
      + '<a class="btn primary" href="../courses.html">교육 일정으로 가기</a>'
      + '<a class="btn" href="mailto:hyunji@crabit.co.kr">문의하기</a>'
      + '</div>';
  }

  if (!oid || !pgToken) {
    fail("결제 정보가 부족해요. 결제창에서 정상적으로 돌아오지 않은 것 같아요.<br />다시 신청해 주시거나, 이미 결제하셨다면 문의해 주세요.");
    return;
  }

  fetch(PAY_API + "/approve", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ order_id: oid, pg_token: pgToken })
  })
    .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
    .then(function (r) {
      if (!r.ok || !r.d.ok) {
        fail(esc(r.d && r.d.error || "잠시 후 다시 시도해 주세요.")
          + "<br />결제가 완료되지 않았다면 돈은 빠져나가지 않았어요.");
        return;
      }
      var d = r.d;
      var a = d.access || {};
      var hasAccess = a.access_url || a.access_password;
      var accessHtml;
      if (hasAccess) {
        accessHtml = '<div class="box access"><h3>바로 시청하실 수 있어요</h3>'
          + (a.access_url ? '<div class="row"><span>시청 페이지</span><b><a href="' + esc(a.access_url) + '">' + esc(a.access_url) + '</a></b></div>' : '')
          + (a.access_password ? '<div class="row"><span>비밀번호</span><b>' + esc(a.access_password) + '</b></div>' : '')
          + (a.access_note ? '<p class="note">' + esc(a.access_note) + '</p>' : '')
          + '<p class="note">이 화면을 캡처해 두시면 편해요. 남겨 주신 연락처로도 같은 안내를 보내드립니다.</p>'
          + '</div>';
      } else {
        accessHtml = '<div class="box access"><h3>시청 안내를 곧 보내드려요</h3>'
          + '<p class="note" style="margin-top:0;">남겨 주신 연락처로 시청 페이지 주소와 비밀번호, 강의자료를 보내드립니다.<br />'
          + '한 시간 안에 안내를 받지 못하시면 문의해 주세요.</p></div>';
      }
      var detailHref = d.event_id ? "../event.html?id=" + encodeURIComponent(d.event_id) : "../courses.html";
      main.innerHTML = '<div class="mark">' + CHECK + '</div>'
        + '<h1>결제가 완료되었습니다</h1>'
        + '<p class="sub">신청해 주셔서 감사합니다. 아래 내용으로 결제되었어요.</p>'
        + '<div class="box">'
        + '<div class="row"><span>강의</span><b>' + esc(d.title) + '</b></div>'
        + (d.approved_at ? '<div class="row"><span>결제 일시</span><b>' + esc(String(d.approved_at).replace("T", " ").slice(0, 16)) + '</b></div>' : '')
        + '<div class="row total"><span>결제 금액</span><b>' + Number(d.amount).toLocaleString("ko-KR") + '원</b></div>'
        + '</div>'
        + accessHtml
        + '<div class="btns">'
        + '<a class="btn primary" href="' + detailHref + '">강의 상세로 가기</a>'
        + '<a class="btn" href="../index.html">홈으로</a>'
        + '</div>';
    })
    .catch(function () {
      fail("네트워크 문제로 확인하지 못했어요. 새로고침하면 다시 확인합니다.<br />결제가 완료되지 않았다면 돈은 빠져나가지 않았어요.");
    });
})();
</script>
</body>
</html>
