<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <!-- 자료/인사이트 썸네일 표준 템플릿:
       연회색 배경 + 좌측 영단어 라벨과 타이틀 + 우측 큼직한 일러스트.
       장식 원형, 하단 캡션은 절대 넣지 않는다. -->
  <rect width="800" height="450" fill="#F9FAFC"/>
  <!-- 브라우저 창 모티프 -->
  <g transform="translate(486 96) rotate(-3)">
    <rect x="14" y="18" width="258" height="246" rx="20" fill="#E8E8E8"/>
    <rect x="0" y="0" width="258" height="246" rx="20" fill="#16192A"/>
    <circle cx="32" cy="30" r="7.5" fill="#FB75BB"/>
    <circle cx="57" cy="30" r="7.5" fill="#FEE9F4"/>
    <circle cx="82" cy="30" r="7.5" fill="#FFFFFF" opacity="0.4"/>
    <rect x="24" y="60" width="210" height="66" rx="13" fill="#FB75BB"/>
    <rect x="24" y="146" width="96" height="76" rx="13" fill="#FFFFFF"/>
    <rect x="138" y="146" width="96" height="15" rx="7.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="138" y="176" width="76" height="15" rx="7.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="138" y="206" width="88" height="15" rx="7.5" fill="#FEE9F4"/>
  </g>
  <text x="64" y="130" font-size="20" letter-spacing="5" fill="#7F808A" font-weight="600">MATERIALS</text>
  <text x="64" y="230" font-size="52" fill="#16192A" font-weight="700">홈페이지형 블로그</text>
  <text x="64" y="298" font-size="52" fill="#16192A" font-weight="700">마스터 <tspan fill="#FB75BB">후속 자료</tspan></text>
</svg>
