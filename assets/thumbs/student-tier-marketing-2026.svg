<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <!-- 자료/인사이트 썸네일 표준 템플릿:
       연회색 배경 + 좌측 영단어 라벨과 타이틀 + 우측 큼직한 일러스트.
       장식 원형, 하단 캡션은 절대 넣지 않는다. -->
  <defs>
    <clipPath id="stairs"><rect x="468" y="60" width="270" height="312" rx="12"/></clipPath>
    <clipPath id="stairsShadow"><rect x="480" y="72" width="270" height="312" rx="12"/></clipPath>
  </defs>
  <rect width="800" height="450" fill="#F9FAFC"/>
  <g transform="translate(156 77.6) scale(0.8)">
  <!-- 원생 5구간 계단 + 꼭대기 깃발. 뒤 회색 판은 다른 썸네일과 같은 오프셋 그림자 -->
    <g clip-path="url(#stairsShadow)">
      <rect x="480" y="324" width="66" height="84" rx="12" fill="#E8E8E8"/>
      <rect x="534" y="278" width="66" height="130" rx="12" fill="#E8E8E8"/>
      <rect x="588" y="232" width="66" height="176" rx="12" fill="#E8E8E8"/>
      <rect x="642" y="186" width="66" height="222" rx="12" fill="#E8E8E8"/>
      <rect x="696" y="140" width="54" height="268" rx="12" fill="#E8E8E8"/>
    </g>
    <g clip-path="url(#stairs)">
      <rect x="468" y="312" width="66" height="84" rx="12" fill="#B9BABF"/>
      <rect x="522" y="266" width="66" height="130" rx="12" fill="#96989F"/>
      <rect x="576" y="220" width="66" height="176" rx="12" fill="#686A75"/>
      <rect x="630" y="174" width="66" height="222" rx="12" fill="#454755"/>
      <rect x="684" y="128" width="54" height="268" rx="12" fill="#16192A"/>
    </g>
    <g font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <text x="495" y="344">1</text>
      <text x="549" y="298">2</text>
      <text x="603" y="252">3</text>
      <text x="657" y="206">4</text>
      <text x="711" y="160">5</text>
    </g>
    <!-- 깃발 -->
    <rect x="698" y="62" width="6" height="70" rx="3" fill="#16192A"/>
    <path d="M704 64 L744 79 L704 94 Z" fill="#FB75BB" stroke="#FB75BB" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="64" y="132" font-size="24" letter-spacing="5" fill="#7F808A" font-weight="600">INSIGHT</text>
  <text x="64" y="232" font-size="60" fill="#16192A" font-weight="700">원생 구간별</text>
  <text x="64" y="310" font-size="60" fill="#16192A" font-weight="700"><tspan fill="#FB75BB">마케팅 전략</tspan> 2026</text>
</svg>
