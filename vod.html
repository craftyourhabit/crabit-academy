<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VOD 강의 - 크래빗 아카데미</title>
<meta name="description" content="구매하면 언제든 시청할 수 있는 크래빗 아카데미 녹화 강의 목록." />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* 포인트 폰트: 엘리스 디지털 배움체 (제목용, OFL - 라이선스: assets/fonts/EliceDigitalBaeum_License.pdf) */
  @font-face {
    font-family: "Elice Digital Baeum";
    src: url("assets/fonts/EliceDigitalBaeum-Bold.woff2") format("woff2");
    font-weight: 700;
    font-display: swap;
  }
  .page-head h1 { font-family: "Elice Digital Baeum", "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  :root {
    --page: #F2F3F6;
    --bg: #FFFFFF;
    --fill: #F2F3F6;
    --fill-soft: #F9FAFC;
    --ink: #16192A;
    --muted: rgba(22, 25, 42, 0.55);
    --line: #E8E8E8;
    --pink: #FB75BB;
    --tint: #FEE9F4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  header {
    background: rgba(244, 246, 248, 0.92);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  .brand img { height: 26px; display: block; }
  .brand a { color: inherit; text-decoration: none; }
  .brand .dot { color: var(--pink); }
  .nav > a { font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: none; }
  .nav > a:hover { color: var(--ink); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; border-radius: 2px; }

  .page-head { padding: 36px 0 24px; }
  .page-head h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .page-head p { margin: 0; font-size: 16px; color: var(--muted); }

  .panel {
    background: var(--bg);
    border-radius: 24px;
    padding: 12px 40px 24px;
    box-shadow: 0 1px 4px rgba(22, 25, 42, 0.05);
    margin-bottom: 56px;
  }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 20px 0 8px; }
  .tab {
    border: 0;
    background: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
    padding: 10px 16px;
    border-radius: 99px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--fill); color: var(--ink); }

  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    padding: 36px 0;
    text-decoration: none;
    color: inherit;
    border: 0;
    background: none;
    font-family: inherit;
    text-align: left;
    width: 100%;
    cursor: pointer;
  }
  .row.static { cursor: default; }
  /* 마감된 강의도 예정 강의와 똑같이 또렷하게 보여 줍니다.
     흐리게 덮지 않고, '마감' 태그 색(.pill.closed)으로만 상태를 구분합니다. */
  .row .info { flex: 1; min-width: 0; }
  .badges { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  /* 상세페이지와 같은 배지 말투를 씁니다.
     외곽선만 두른 것이 분류, 회색으로 채운 것이 상태입니다.
     핑크는 '오늘' 하나에만 씁니다. 하루만 붙는 배지라서요. */
  .pill {
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 99px;
    letter-spacing: 0.02em;
    background: var(--fill);
    color: var(--ink);
  }
  .pill.line { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .pill.gray { background: var(--fill); color: var(--muted); }
  /* 마감은 채운 회색 태그로. 카드는 흐리게 하지 않고 태그 색만으로 구분합니다. */
  .pill.closed { background: #54586A; color: #fff; }
  .pill.today { background: var(--pink); color: #fff; }
  /* 교육/설명회 구분. 교육은 노랑, 설명회는 하늘색. */
  .pill.kind-edu  { background: #FFF1CC; color: #8A6A12; }
  .pill.kind-info { background: #DEEEFF; color: #2C67AE; }
  .row h2 {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.4;
    transition: color 0.15s;
  }
  .row:not(.static):hover h2 { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
  .row .sub { font-size: 15px; color: var(--muted); }
  .row .thumb-wrap {
    position: relative; flex: none; width: 240px;
    aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
    container-type: inline-size;
  }
  /* 썸네일 위 실제 글자 오버레이. event.html의 같은 장치와 동일한 데이터를 쓴다. */
  .cov-ov {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; padding: 7cqw 6cqw; pointer-events: none;
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .cov-ov.t-navy { background: linear-gradient(100deg, #16192A 0%, #16192A 56%, rgba(22,25,42,0) 74%); }
  .cov-ov.t-white { background: linear-gradient(100deg, #FFFFFF 0%, #FFFFFF 45%, rgba(255,255,255,0) 63%); }
  /* 로고와 간격을 두고 제목을 조금 아래로 내릴 때 쓴다. */
  .cov-ov.shift { justify-content: flex-end; padding-bottom: 7cqw; }
  .cov-ov .ov-logo { position: absolute; top: 6cqw; left: 6cqw; height: 5cqw; width: auto; display: block; }
  .cov-ov .ov-eyebrow {
    align-self: flex-start; background: #0B0D18; color: #fff; font-weight: 700;
    font-size: 2.5cqw; padding: 1.1cqw 2.3cqw; border-radius: 99px; margin-bottom: 2cqw;
    letter-spacing: -0.01em; white-space: nowrap;
  }
  .cov-ov .ov-line { font-weight: 700; letter-spacing: -0.02em; line-height: 1.18; margin: 0; white-space: pre; }
  .cov-ov .ov-line.sz-huge { font-size: 10.5cqw; }
  .cov-ov .ov-line.sz-title { font-size: 7.4cqw; }
  /* 긴 제목용. 우측 일러스트를 침범하지 않는 최대 크기다. */
  .cov-ov .ov-line.sz-mid { font-size: 5.8cqw; }
  .cov-ov .ov-line.sz-sub { font-size: 3.1cqw; font-weight: 600; margin-top: 1.4cqw; }
  .cov-ov.t-navy .ov-line { color: #fff; }
  .cov-ov.t-white .ov-line { color: var(--ink); }
  .cov-ov .ov-line.accent { color: var(--pink); }
  .row .thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: var(--fill);
    border: 1px solid var(--line);
    display: block;
  }
  .empty { padding: 48px 0; text-align: center; color: var(--muted); font-size: 16px; }
  /* 좁은 화면에서는 썸네일을 위로 올리고 글을 아래에 둡니다. 옆으로 두면 제목이 한 글자씩 세로로 꺾여요. */
  @media (max-width: 640px) {
    .row { flex-direction: column-reverse; align-items: stretch; gap: 16px; padding: 26px 0; }
    .row .thumb-wrap { width: 100%; }
    .row h2 { font-size: 19px; }
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 40px 0 44px;
    font-size: 14px;
    color: var(--muted);
  }
  .f-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .f-brand img { height: 22px; display: block; }
  .f-brand .dot { color: var(--pink); }
  .f-sns { display: flex; gap: 18px; }
  .f-sns a { color: var(--muted); text-decoration: none; font-weight: 500; }
  .f-sns a:hover { color: var(--ink); }
  .f-info { line-height: 1.8; }
  .f-info p { margin: 0; }
  .f-bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .f-bottom a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .f-bottom a:hover { color: var(--ink); }

  /* 교육/설명회 - 상태 알약 왼쪽의 분류. 채운 알약과 구분되게 외곽선만 */
  .pill.line { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  /* 당일 - 하루만 붙는 알약이라 브랜드 핑크를 꽉 채워 가장 강하게 */
  .pill.today { background: var(--pink); color: #fff; }
</style>

<script>
/* GitHub Pages 는 정적 파일을 10분간 캐시하라고 응답합니다(max-age=600).
   그래서 어드민에서 강의를 고쳐도 이미 방문했던 분에게는 최대 10분간
   옛 내용이 보입니다. 주소 뒤에 5분 단위로 바뀌는 값을 붙여 그 창을 줄입니다.
   같은 5분 안에서는 주소가 같으므로 캐시는 그대로 살아 있습니다.
   document.write 를 쓰는 이유는 아래 스크립트들이 EVENTS_DB 를 곧바로
   쓰기 때문입니다. 순서를 지키려면 이 방법이 가장 단순합니다. */
document.write('<scr' + 'ipt src="assets/events.js?v=' + Math.floor(Date.now() / 300000) + '"></scr' + 'ipt>');
</script>
<script>
/* ---------- VOD 강의 전체 목록 ----------
   events.js 에서 format 이 "vod" 인 항목을 전부 보여줍니다. SHOW_IDS 가 따로 없어서
   어드민에서 진행 방식을 VOD로 저장하면 여기에 바로 뜹니다. 숨기려면 hidden: true.
   정렬은 releaseDate 최신순. 날짜가 없는 항목은 방금 올린 것으로 보고 맨 위에 둡니다. */
(function () {
  const ALL = "전체";
  let active = ALL;

  const tabsEl = document.getElementById("tabs");
  const rowsEl = document.getElementById("rows");

  const VODS = Object.entries(EVENTS_DB)
    .filter(([, ev]) => ev.format === "vod" && !ev.hidden)
    .sort((a, b) => {
      const da = a[1].releaseDate || "", db = b[1].releaseDate || "";
      if (!da || !db) return !da && !db ? 0 : (da ? 1 : -1);
      return db.localeCompare(da);
    });
  const CATEGORIES = [ALL].concat(Array.from(new Set(VODS.map(([, ev]) => ev.category).filter(Boolean))));

  function coverOverlayEl(ov) {
    if (!ov) return null;
    const wrap = document.createElement("div");
    wrap.className = "cov-ov t-" + (ov.theme || "navy") + (ov.shift ? " shift" : "");
    if (ov.eyebrow) {
      const eb = document.createElement("span");
      eb.className = "ov-eyebrow";
      eb.textContent = ov.eyebrow;
      wrap.appendChild(eb);
    }
    (ov.lines || []).forEach(l => {
      const p = document.createElement("p");
      p.className = "ov-line sz-" + (l.size || "title") + (l.accent ? " accent" : "");
      p.textContent = l.text;
      wrap.appendChild(p);
    });
    return wrap;
  }

  /* 판매 상태와 가격만 답니다. 진행 방식은 전부 VOD라 따로 표시하지 않아요. */
  function badges(ev) {
    const t = eventStatusTag(ev);
    const price = eventPriceInfo(ev);
    return '<span class="pill ' + (t.cls === "closed" ? "closed" : "") + '">' + t.text + "</span>"
      + (price.text ? '<span class="pill gray">' + price.text + "</span>" : "");
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    if (CATEGORIES.length <= 2) { tabsEl.style.display = "none"; return; }
    CATEGORIES.forEach(c => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tab" + (c === active ? " active" : "");
      b.textContent = c;
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", c === active ? "true" : "false");
      b.addEventListener("click", () => { active = c; renderTabs(); renderRows(); });
      tabsEl.appendChild(b);
    });
  }

  function renderRows() {
    const entries = VODS.filter(([, ev]) => active === ALL || ev.category === active);
    rowsEl.innerHTML = "";
    if (entries.length === 0) {
      rowsEl.innerHTML = '<div class="empty">VOD 강의를 준비하고 있어요.</div>';
      return;
    }
    entries.forEach(([id, ev]) => {
      const a = document.createElement("a");
      a.className = "row" + (isEventOver(ev) ? " is-closed" : "");
      a.href = "event?id=" + id;
      a.innerHTML =
        '<div class="info">'
        + '<div class="badges">' + badges(ev) + "</div>"
        + "<h2></h2>"
        + '<div class="sub"></div>'
        + "</div>"
        + '<div class="thumb-wrap"><img class="thumb" src="' + ev.thumb + '" alt="" loading="lazy" /></div>';
      a.querySelector("h2").textContent = ev.title;
      a.querySelector(".sub").textContent = (ev.speaker ? ev.speaker + "  |  " : "") + (ev.date || "");
      const ov = coverOverlayEl(ev.coverOverlay);
      if (ov) a.querySelector(".thumb-wrap").appendChild(ov);
      rowsEl.appendChild(a);
    });
  }

  renderTabs();
  renderRows();
})();
</script>
