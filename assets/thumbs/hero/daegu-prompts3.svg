  <rect width="800" height="450" fill="#F9FAFC"/>
  <!-- 복사해서 쓰는 프롬프트 카드 + 커서 + 3종 배지 -->
  <g transform="translate(400 225) rotate(-4) translate(-115 -145)">
    <g>
      <rect x="10" y="10" width="220" height="280" rx="20" fill="#16192A"/>
      <rect x="0" y="0" width="220" height="280" rx="20" fill="#FFFFFF"/>
      <rect x="26" y="30" width="84" height="26" rx="13" fill="#FEE9F4"/>
      <rect x="26" y="82" width="168" height="11" rx="5.5" fill="#16192A"/>
      <rect x="26" y="108" width="136" height="11" rx="5.5" fill="#DCDDDF"/>
      <rect x="26" y="134" width="156" height="11" rx="5.5" fill="#DCDDDF"/>
      <rect x="26" y="160" width="106" height="11" rx="5.5" fill="#FB75BB"/>
      <rect x="26" y="208" width="168" height="42" rx="12" fill="#16192A"/>
      <rect x="66" y="224" width="88" height="10" rx="5" fill="#FFFFFF"/>
    </g>
    <g transform="translate(150 222)"><path d="M0 0 L0 44 L11 33 L19 51 L27 47 L19 30 L34 30 Z" fill="#FFFFFF" stroke="#16192A" stroke-width="4.5" stroke-linejoin="round"/></g>
  </g>
  <circle cx="532" cy="98" r="36" fill="#16192A"/>
  <text x="532" y="109" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
