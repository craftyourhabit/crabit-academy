<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>행사 상세 - 크래빗 아카데미</title>
<meta name="description" content="크래빗 아카데미의 웨비나·강의·행사 상세 정보" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* 포인트 폰트: 엘리스 디지털 배움체 (제목용, OFL - 라이선스: assets/fonts/EliceDigitalBaeum_License.pdf) */
  @font-face {
    font-family: "Elice Digital Baeum";
    src: url("assets/fonts/EliceDigitalBaeum-Bold.woff2") format("woff2");
    font-weight: 700;
    font-display: swap;
  }
  :root {
    --bg: #FFFFFF;
    --fill: #F2F3F6;
    --fill-soft: #F9FAFC;
    --ink: #16192A;
    --muted: rgba(22, 25, 42, 0.55);
    --line: #E8E8E8;
    --pink: #FB75BB;
    --tint: #FEE9F4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  header { box-shadow: 0 1px 4px rgba(22, 25, 42, 0.06); position: sticky; top: 0; background: rgba(255, 255, 255,0.92); backdrop-filter: blur(8px); z-index: 20; }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  .brand img { height: 26px; display: block; }
  .brand a { color: inherit; text-decoration: none; }
  .brand .dot { color: var(--pink); }
  .nav > a { font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: none; }
  .nav > a:hover { color: var(--ink); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; border-radius: 2px; }

  /* main은 .wrap도 함께 쓰므로 .wrap의 padding:0 24px에 눌리지 않도록 특이도를 높인다 */
  main.wrap { padding-top: 56px; padding-bottom: 140px; }
  .thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    border-radius: 20px;
    box-shadow: 0 4px 16px rgba(22, 25, 42, 0.09);
    margin-bottom: 32px;
    background: var(--fill);
  }
  .meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .badge {
    font-size: 13px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 99px;
    letter-spacing: 0.04em;
  }
  /* 교육/설명회 - 상태 배지 왼쪽의 분류. 채운 배지들과 구분되게 외곽선만 */
  .badge.kind { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .badge.status-upcoming { background: var(--fill); color: var(--ink); }
  /* 당일 - 하루만 붙는 배지라 브랜드 핑크를 꽉 채워 가장 강하게 */
  .badge.status-today { background: var(--pink); color: #fff; }
  .badge.status-soon { background: var(--fill); color: var(--muted); }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(28px, 4.5vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.3;
    /* balance 를 쓰면 줄을 고르게 나누느라 제목이 좁게 접힌다.
       썸네일 폭을 꽉 채우도록 그대로 흘려보낸다. */
    text-wrap: pretty;
  }
  .date {
    font-size: 16px;
    color: var(--muted);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    margin-bottom: 28px;
  }
  .date a {
    color: var(--ink);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  /* 진행 방식. 온라인 참여 링크는 이 페이지에 절대 싣지 않는다.
     링크를 아는 사람은 누구나 들어올 수 있기 때문이다. */
  .date .fmt {
    display: inline-block; font-size: 13.5px; font-weight: 600;
    padding: 2px 10px; border-radius: 99px;
    background: var(--fill); color: var(--ink); margin-right: 2px;
  }
  .desc { font-size: 17.5px; color: var(--ink); margin: 0 0 28px; max-width: 40em; text-wrap: pretty; }

  .speaker { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
  .speaker:last-of-type { margin-bottom: 28px; }
  .speaker .s-label {
    flex: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--pink);
    text-transform: uppercase;
  }
  /* 스페셜 조교는 연사보다 한 단계 낮은 정보라 라벨을 회색으로 */
  .speaker.assist .s-label { color: var(--muted); letter-spacing: 0; }
  .speaker strong { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .speaker .s-role { font-size: 15px; color: var(--muted); }

  /* 섹션 제목 - 홈과 같이 엘리스 배움체로, 본문보다 확실히 크게.
     콜아웃 안의 준비물·추천 대상(h3)도 '이런 내용을 다뤄요'와 같은 급으로 맞춘다. */
  .sec-h, .points h2, .points h3, .materials h2 {
    font-family: "Elice Digital Baeum", "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .points {
    background: var(--fill-soft);
    border-radius: 16px;
    padding: 30px 34px;
    margin-bottom: 36px;
    box-shadow: 0 1px 4px rgba(22, 25, 42, 0.05);
  }
  .points h2 { margin: 0 0 18px; }
  .points ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 11px; }
  .points li { display: flex; gap: 12px; font-size: 17px; align-items: baseline; }
  .points li::before {
    content: "";
    flex: none;
    width: 7px; height: 7px;
    border-radius: 99px;
    background: var(--pink);
    transform: translateY(-2px);
  }
  /* 준비물·추천 대상 - 같은 콜아웃 안에서 구분선으로만 나눈다.
     제목·본문 모두 '이런 내용을 다뤄요'와 동일한 규격을 쓴다. */
  .p-extra { margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--line); }
  .points h3 { margin: 0 0 18px; }

  /* ---------- 수강료와 신청 방법 ----------
     계좌 정보는 이 페이지에 두지 않는다. 공개 레포라 검색에 노출되므로
     신청서를 낸 분에게만 구글폼 확인 화면과 응답 메일로 안내한다. */
  .fee {
    background: var(--fill-soft);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 30px 34px;
    margin-bottom: 36px;
  }
  .fee h2 { margin: 0 0 18px; }
  .fee .amount { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
  .fee .amount-note { margin: 6px 0 0; font-size: 15px; color: var(--muted); }
  .fee ol {
    margin: 24px 0 0;
    padding: 0;
    list-style: none;
    counter-reset: step;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .fee li {
    counter-increment: step;
    display: flex;
    gap: 12px;
    font-size: 16.5px;
    line-height: 1.55;
    align-items: flex-start;
  }
  .fee li::before {
    content: counter(step);
    flex: none;
    width: 23px; height: 23px;
    border-radius: 99px;
    background: var(--pink);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateY(2px);
  }
  .fee .caution {
    margin: 22px 0 0;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 15px;
    line-height: 1.65;
    color: var(--muted);
  }
  .fee .cline { margin: 0 0 8px; }
  .fee .cline:last-child { margin-bottom: 0; }
  .fee .cline b { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .fee .cline a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 640px) {
    .fee { padding: 26px 22px; }
    .fee .amount { font-size: 24px; }
  }

  /* ---------- 신청 폼 ----------
     구글폼 대신 페이지 안에서 바로 받는다. 제출은 Supabase로 곧장 간다.
     공개용 키만 쓰고, 남의 신청을 읽는 건 테이블 권한과 RLS가 막는다. */
  .applyform { scroll-margin-top: 20px; margin-bottom: 36px; }
  .applyform h2 { margin: 0 0 6px; }
  .applyform .form-sub { margin: 0 0 22px; font-size: 15.5px; color: var(--muted); line-height: 1.6; }
  .applyform .fields { display: flex; flex-direction: column; gap: 18px; }
  .applyform .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .applyform label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .applyform label .req { color: var(--pink); margin-left: 3px; }
  .applyform input[type="text"],
  .applyform input[type="tel"],
  .applyform input[type="email"],
  .applyform textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 15px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    transition: border-color 0.15s;
  }
  .applyform input:focus, .applyform textarea:focus {
    outline: none;
    border-color: var(--ink);
  }
  .applyform textarea { resize: vertical; min-height: 92px; line-height: 1.6; }
  /* 자동 프로그램만 채우는 칸. 사람 눈에는 안 보인다. */
  .applyform .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .applyform .consent {
    margin-top: 4px;
    padding: 18px 20px;
    background: var(--fill-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .applyform .consent-row { display: flex; gap: 10px; align-items: flex-start; }
  .applyform .consent-row input { flex: none; width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ink); }
  .applyform .consent-row label { margin: 0; font-weight: 600; font-size: 15px; line-height: 1.5; }
  .applyform .consent-detail { margin: 10px 0 0 28px; font-size: 13.5px; color: var(--muted); line-height: 1.65; }

  .applyform .submit-row { margin-top: 22px; }
  .applyform button.submit {
    width: 100%;
    padding: 16px;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--ink);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .applyform button.submit:hover { background: #333333; }
  .applyform button.submit:disabled { opacity: 0.5; cursor: default; }
  .applyform .formmsg { margin: 14px 0 0; font-size: 15px; line-height: 1.6; }
  .applyform .formmsg.err { color: #C0392B; font-weight: 600; }

  .applyform .done {
    background: var(--fill-soft);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 34px;
    text-align: center;
  }
  .applyform .done h3 { margin: 0 0 12px; font-size: 21px; font-weight: 700; }
  .applyform .done p { margin: 0; font-size: 16px; line-height: 1.7; color: var(--ink); }
  .applyform .done .next { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); }

  /* ---------- 주문 확인과 결제 ----------
     신청서를 낸 뒤 이어지는 화면. 금액과 제공 조건을 다시 보여 주고
     동의를 받은 다음 결제로 넘어간다. */
  .order h3 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .order .o-sub { margin: 0 0 22px; font-size: 15.5px; color: var(--muted); }
  .o-box { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 26px; }
  .o-row { display: flex; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); font-size: 15.5px; }
  .o-row:last-child { border-bottom: 0; }
  .o-row > span { flex: none; width: 96px; color: var(--muted); }
  .o-row > b { font-weight: 600; flex: 1; }
  .o-row.total { background: var(--fill-soft); }
  .o-row.total > b { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .o-h { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
  .o-pay {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 12px; padding: 15px 18px;
    font-size: 15.5px; font-weight: 600; cursor: pointer; margin-bottom: 22px;
  }
  .o-pay input { width: 18px; height: 18px; accent-color: var(--ink); }
  .o-agree { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.6; margin-bottom: 18px; }
  .o-agree input { flex: none; width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ink); }
  .o-agree a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .o-msg { margin: 0 0 14px; font-size: 15px; line-height: 1.6; color: var(--muted); }
  .o-msg.err { color: #C0392B; font-weight: 600; }
  .order .submit {
    width: 100%; padding: 16px; font: inherit; font-size: 17px; font-weight: 700;
    color: #fff; background: var(--ink); border: 0; border-radius: 12px; cursor: pointer;
  }
  .order .submit:hover { background: #333333; }
  .order .submit:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 640px) {
    .applyform .row2 { grid-template-columns: 1fr; }
    .o-row { flex-direction: column; gap: 4px; }
    .o-row > span { width: auto; font-size: 13.5px; }
  }

  /* ---------- 커리큘럼 (세션별 안내) ----------
     포스터를 왼쪽에 두고 오른쪽에 설명을 세우는 가로형. 좁은 화면에서는 위아래로 쌓는다. */
  .sec-h { margin: 0 0 16px; }
  .sessions { margin: 0 0 36px; }
  .s-grid { display: flex; flex-direction: column; gap: 16px; }
  .s-card {
    background: var(--fill-soft);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
  .s-card img {
    flex: none;
    width: 270px;
    display: block;
    aspect-ratio: 1190 / 1684;
    object-fit: cover;
    background: var(--fill);
  }
  .s-body { flex: 1; min-width: 0; padding: 28px 30px; display: flex; flex-direction: column; justify-content: center; }
  .s-no { font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: var(--pink); }
  .s-title { font-size: 23px; font-weight: 700; margin: 8px 0 18px; letter-spacing: -0.01em; line-height: 1.35; text-wrap: pretty; }
  .s-who { font-size: 18px; font-weight: 700; margin: 0; }
  .s-who span { display: block; margin-top: 5px; font-size: 15.5px; font-weight: 400; color: var(--muted); line-height: 1.55; }
  /* 본문 항목은 '이런 내용을 다뤄요'의 불릿과 같은 크기·굵기 */
  .s-pts { margin: 18px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .s-pts li { font-size: 17px; color: var(--muted); display: flex; gap: 11px; align-items: baseline; }
  .s-pts li::before {
    content: "";
    flex: none;
    width: 5px; height: 5px;
    border-radius: 99px;
    background: rgba(22, 25, 42, 0.3);
    transform: translateY(-2px);
  }
  @media (max-width: 640px) {
    .s-card { flex-direction: column; }
    .s-card img { width: 100%; }
    .s-body { padding: 22px 24px 26px; }
  }

  /* ---------- 제공 자료 (다크 섹션) ---------- */
  .materials { background: var(--ink); border-radius: 18px; padding: 34px 34px 36px; margin-bottom: 36px; }
  .materials h2 { margin: 0 0 6px; color: #fff; }
  .materials .m-sub { margin: 0 0 22px; font-size: 15.5px; color: rgba(255, 255, 255, 0.55); }
  .m-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (max-width: 600px) { .m-grid { grid-template-columns: 1fr; } }
  .m-item {
    display: flex;
    gap: 14px;
    align-items: baseline;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .m-num { flex: none; font-size: 13.5px; font-weight: 700; color: var(--pink); font-variant-numeric: tabular-nums; }
  .m-name { font-size: 16.5px; font-weight: 600; color: #fff; line-height: 1.45; }
  .m-note { display: block; margin-top: 5px; font-size: 14px; font-weight: 400; color: rgba(255, 255, 255, 0.55); }

  /* ---------- 카드뉴스 상세 ---------- */
  .detail { margin: 0 0 36px; }
  /* 상세 이미지는 썸네일과 같은 폭으로 크게 보여 준다.
     좁게 묶어 두면 카드 안 글씨가 작아져 읽히지 않는다. */
  .detail-strip {
    margin: 0 auto 36px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  /* 흰 배경 카드뉴스를 여백 없이 이어 붙여 한 장의 상세페이지처럼 보이게 한다 */
  .detail-strip img { width: 100%; display: block; margin: 0; }

  /* 신청 버튼 옆 담당자 문의 */
  .contact-note { font-size: 14.5px; color: var(--muted); font-weight: 500; }
  .contact-note a { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- 하단 고정 신청 바 ----------
     실행 가능한 CTA(신청·문의·다시보기)가 있을 때만 렌더된다.
     '다시보기 준비 중'처럼 누를 게 없는 상태는 본문에 문구로만 남긴다. */
  .apply-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 30;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .apply-bar .bar-inner { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .apply-bar .btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 18px 28px;
    font-size: 17px;
    border-radius: 14px;
  }
  .apply-bar .contact-note { font-size: 14px; }
  .btn {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #333333; }
  .soon-note { font-size: 15px; color: var(--muted); font-weight: 500; }
  .closed-note {
    margin-top: 20px;
    background: var(--tint);
    border-radius: 16px;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: flex-start;
  }
  .closed-note[hidden] { display: none; }

  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    isApplyFlow = true;
    /* applyUrl 이 있으면 외부 폼을 우선한다. 공동 주최라 상대 쪽 폼으로

        if (!agree.checked) {
          msg.textContent = "이용약관과 환불 규정에 동의해 주세요.";
          msg.className = "o-msg err";
          msg.hidden = false;
          return;
        }
        /* 카카오페이 가맹 승인 후 여기서 결제창을 부릅니다. */
        msg.innerHTML = "카카오페이 결제 연동을 준비하고 있어요.<br />"
          + "지금은 담당자가 결제 방법을 따로 안내해 드립니다. 신청은 이미 접수되었어요.";
        msg.className = "o-msg";
        msg.hidden = false;
        btn.disabled = true;
        btn.textContent = "접수 완료";
      });
    }

    formEl.addEventListener("submit", async e => {
      e.preventDefault();
      const val = n => (formEl.elements[n] ? formEl.elements[n].value.trim() : "");

      if (!val("name")) { show("이름을 입력해 주세요.", true); formEl.elements.name.focus(); return; }
      const digits = val("phone").replace(/[^0-9]/g, "");
      if (digits.length < 9 || digits.length > 11) {
        show("연락처를 다시 확인해 주세요.", true); formEl.elements.phone.focus(); return;
      }
      if (!formEl.elements.consent.checked) {
        show("개인정보 수집과 이용에 동의해 주셔야 신청할 수 있어요.", true); return;
      }

      /* 사람 눈에 안 보이는 칸이 채워져 있으면 자동 프로그램이다.
         조용히 성공한 척하고 보내지 않는다. */
      if (val("website")) {
        show("신청이 접수되었습니다.", false);
        return;
      }

      btn.disabled = true;
      show("접수하는 중이에요…", false);

      /* 빈 칸은 아예 빼고 보낸다. 빈 문자열이 들어가면 길이 제약에 걸릴 수 있다. */
      const row = {
        event_id: id,
        event_title: ev.title,
        event_fee: price.text || null,
        event_price: price.amount,
        name: val("name"),
        phone: digits,
        email: val("email") || null,
        org: val("org") || null,
        source: val("source") || null,
        message: val("message") || null,
        consent: true
      };

      try {
        const res = await fetch(APPLY_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SB_KEY,
            "Authorization": "Bearer " + SB_KEY,
            /* 넣기만 하고 돌려받지 않는다. anon 은 읽기 권한이 없으므로
               return=representation 을 쓰면 오히려 실패한다. */
            "Prefer": "return=minimal"
          },
          body: JSON.stringify(row)
        });

        if (!res.ok) {
          /* 23505 는 유니크 위반. 같은 강의에 같은 번호로 이미 넣은 경우다. */
          const err = await res.json().catch(() => ({}));
          const dup = res.status === 409 || err.code === "23505";
          show(dup
            ? "이미 같은 연락처로 신청이 접수돼 있어요. 확인이 필요하시면 문의해 주세요."
            : "접수에 실패했어요. 잠시 후 다시 시도해 주세요.", true);
          btn.disabled = false;
          return;
        }

        /* 성공하면 폼 자리를 다음 단계로 바꾼다.
           유료 강의는 주문 확인과 결제로, 무료 강의는 완료 안내로 간다. */
        const sec = document.getElementById("applyform");
        sec.innerHTML = price.paid ? orderHtml(val("name")) : doneHtml();
        sec.scrollIntoView({ behavior: "smooth", block: "start" });
        if (price.paid) bindOrder();
      } catch {
        show("네트워크 문제로 접수하지 못했어요. 잠시 후 다시 시도해 주세요.", true);
        btn.disabled = false;
      }
    });
  }

  const closedBtn = document.getElementById("closedApply");
  if (closedBtn) {
    closedBtn.addEventListener("click", () => {
      const note = document.getElementById("closedNote");
      note.hidden = false;
      closedBtn.style.display = "none";
      note.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
  }
})();
</script>
