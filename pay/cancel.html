<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>결제 취소 - 크래빗 아카데미</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../assets/favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root { --bg: #FFFFFF; --fill-soft: #F9FAFC; --ink: #16192A; --muted: rgba(22, 25, 42, 0.55); --line: #E8E8E8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 64px 20px 80px; }
  .mark { width: 56px; height: 56px; border-radius: 50%; background: var(--fill-soft); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 28px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 13px 22px; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); color: var(--ink); background: #fff; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #333333; }
  .btn:not(.primary):hover { background: #F0F0F0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16192A" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
  <h1>결제를 취소하셨어요</h1>
  <p class="sub">결제가 진행되지 않았고 돈도 빠져나가지 않았습니다.<br />
  신청 내용은 남아 있으니, 마음이 바뀌시면 언제든 다시 결제하실 수 있어요.</p>
  <div class="btns">
    <a class="btn primary" href="../courses.html">교육 일정으로 가기</a>
    <a class="btn" href="../index.html">홈으로</a>
  </div>
</div>
</body>
</html>
