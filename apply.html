<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>신청하기 - 크래빗 아카데미</title>
<meta name="description" content="크래빗 아카데미 교육 신청" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* 포인트 폰트: 엘리스 디지털 배움체 (제목용, OFL - 라이선스: assets/fonts/EliceDigitalBaeum_License.pdf) */
  @font-face {
    font-family: "Elice Digital Baeum";
    src: url("assets/fonts/EliceDigitalBaeum-Bold.woff2") format("woff2");
    font-weight: 700;
    font-display: swap;
  }
  :root {
    --bg: #FFFFFF;
    --fill: #F2F3F6;
    --fill-soft: #F9FAFC;
    --ink: #16192A;
    --muted: rgba(22, 25, 42, 0.55);
    --faint: rgba(22, 25, 42, 0.30);
    --line: #E8E8E8;
    --pink: #FB75BB;
    --tint: #FEE9F4;
    --hd: 63px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  /* 상세페이지와 같은 컨테이너를 씁니다. 오른쪽에 주문 요약이 서기 때문입니다. */
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
  header {
    box-shadow: 0 1px 4px rgba(22, 25, 42, 0.06);
    position: sticky; top: 0; z-index: 40;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
  }
  /* .nav 는 .wrap 을 겸합니다. padding 을 통째로 쓰면 좌우 여백이 0 으로 덮여
     좁은 화면에서 로고가 화면 끝에 붙습니다. 세로 값만 지정합니다. */
  .nav { display: flex; align-items: center; justify-content: space-between; padding-top: 18px; padding-bottom: 18px; }
  .brand img { height: 26px; display: block; }
  .brand a { color: inherit; text-decoration: none; }
  .nav > a { font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: none; }
  .nav > a:hover { color: var(--ink); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; border-radius: 2px; }

  main.wrap { padding-top: 34px; padding-bottom: 110px; }

  .back {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 15px; font-weight: 500; color: var(--muted);
    text-decoration: none; margin-bottom: 22px;
  }
  .back:hover { color: var(--ink); }

  /* ---------- 진행 단계 ----------
     신청서를 쓰다가 "이게 바로 결제되는 건가" 하고 멈칫하지 않도록
     지금 어디쯤인지 먼저 보여 줍니다. */
  .steps { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
  .steps .st { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 600; color: var(--faint); }
  .steps .st .n {
    flex: none; width: 24px; height: 24px; border-radius: 99px;
    background: var(--fill); color: var(--muted);
    font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .steps .st.on { color: var(--ink); }
  .steps .st.on .n { background: var(--ink); color: #fff; }
  .steps .st.done .n { background: var(--pink); color: #fff; }
  .steps .arw { color: var(--faint); font-size: 13px; }

  /* ---------- 본문과 주문 요약 ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 332px; gap: 56px; align-items: start; }
  .col { max-width: 680px; }

  h1.sec-h {
    font-family: "Elice Digital Baeum", "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 27px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3;
    margin: 0 0 8px;
  }
  .form-sub { margin: 0 0 28px; font-size: 15.5px; color: var(--muted); line-height: 1.6; }

  /* ---------- 신청 폼 ---------- */
  .fields { display: flex; flex-direction: column; gap: 20px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  label { display: flex; align-items: center; font-size: 14.5px; font-weight: 700; margin-bottom: 8px; }
  label .req { color: var(--pink); margin-left: 4px; }
  .ic { flex: none; margin-right: 7px; color: var(--faint); }
  input[type="text"], input[type="tel"], input[type="email"], textarea, select {
    width: 100%;
    padding: 13px 15px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--ink); }
  select { cursor: pointer; }

  /* ---------- 자체 드롭다운 ----------
     브라우저 기본 셀렉트 대신 사이트 톤에 맞는 메뉴를 직접 그립니다. */
  .dd { position: relative; }
  .dd-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 15px; font: inherit; font-size: 16px; text-align: left;
    color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
    transition: border-color 0.15s;
  }
  .dd.open .dd-btn, .dd-btn:focus { outline: none; border-color: var(--ink); }
  .dd-btn .dd-val.placeholder { color: var(--faint); }
  .dd-btn .caret { flex: none; transition: transform 0.15s; color: var(--muted); }
  .dd.open .caret { transform: rotate(180deg); }
  .dd-menu {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 30;
    margin: 0; padding: 8px; list-style: none;
    background: #fff; border-radius: 16px;
    box-shadow: 0 12px 32px rgba(22, 25, 42, 0.16);
  }
  .dd-menu[hidden] { display: none; }
  .dd-menu li {
    padding: 12px 14px; border-radius: 10px; cursor: pointer;
    font-size: 15.5px; font-weight: 500; line-height: 1.5;
    transition: background 0.12s;
  }
  .dd-menu li:hover { background: var(--fill-soft); }
  .dd-menu li[aria-selected="true"] { background: var(--tint); font-weight: 700; }
  textarea { resize: vertical; min-height: 96px; line-height: 1.6; }
  /* 자동 프로그램만 채우는 칸. 사람 눈에는 안 보입니다. */
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .consent { margin-top: 6px; padding: 20px 22px; background: var(--fill-soft); border-radius: 14px; }
  .consent-row { display: flex; gap: 11px; align-items: flex-start; }
  .consent-row input { flex: none; width: 18px; height: 18px; margin-top: 3px; accent-color: var(--ink); }
  .consent-row label { margin: 0; font-weight: 700; font-size: 15px; line-height: 1.5; }
  .consent-detail { margin: 11px 0 0 29px; font-size: 13.5px; color: var(--muted); line-height: 1.7; }

  .submit-row { margin-top: 26px; }
  button.submit {
    width: 100%; padding: 17px;
    font: inherit; font-size: 17px; font-weight: 700;
    color: #fff; background: var(--ink);
    border: 0; border-radius: 12px; cursor: pointer;
    transition: background 0.15s;
  }
  button.submit:hover { background: #333333; }
  button.submit:disabled { opacity: 0.5; cursor: default; }
  .formmsg { margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: var(--muted); }
  .formmsg.err { color: #C0392B; font-weight: 600; }

  /* ---------- 접수 완료 ---------- */
  .done { border: 1px solid var(--line); border-radius: 18px; padding: 40px 34px; text-align: center; }
  .done .mark {
    width: 52px; height: 52px; border-radius: 99px; background: var(--tint);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
  }
  .done h3 { margin: 0 0 10px; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .done p { margin: 0; font-size: 16px; line-height: 1.75; color: var(--muted); }
  .done .btn-back {
    display: inline-block; margin-top: 24px; padding: 13px 24px;
    font-size: 15px; font-weight: 700; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 11px; text-decoration: none;
  }
  .done .btn-back:hover { background: var(--fill-soft); }

  /* ---------- 주문 확인 ---------- */
  .order h1 { margin: 0 0 8px; }
  .o-sub { margin: 0 0 26px; font-size: 15.5px; color: var(--muted); }
  .o-box { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 28px; }
  .o-row { display: flex; gap: 18px; padding: 15px 20px; border-bottom: 1px solid var(--line); font-size: 15.5px; line-height: 1.6; }
  .o-row:last-child { border-bottom: 0; }
  .o-row > span { flex: none; width: 92px; color: var(--muted); font-weight: 500; }
  .o-row > b { font-weight: 600; flex: 1; }
  .o-row.total { background: var(--fill-soft); }
  .o-row.total > b { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .o-h { margin: 0 0 12px; font-size: 14.5px; font-weight: 700; }
  .o-pay {
    display: flex; align-items: center; gap: 11px;
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
    font-size: 15.5px; font-weight: 600; cursor: pointer; margin-bottom: 22px;
  }
  .o-pay input { width: 18px; height: 18px; accent-color: var(--ink); }
  .o-agree { display: flex; gap: 11px; align-items: flex-start; font-size: 14.5px; line-height: 1.6; margin-bottom: 20px; }
  .o-agree input { flex: none; width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ink); }
  .o-agree a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .o-msg { margin: 0 0 16px; font-size: 15px; line-height: 1.7; color: var(--muted); }
  .o-msg.err { color: #C0392B; font-weight: 600; }

  /* ---------- 주문 요약 (오른쪽) ---------- */
  .rail { position: sticky; top: calc(var(--hd) + 28px); }
  .sum { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 8px 28px rgba(22, 25, 42, 0.07); background: #fff; }
  .sum .thumb-wrap { position: relative; container-type: inline-size; }
  .sum img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--fill); }
  /* 썸네일 위 실제 글자 오버레이. event.html의 같은 장치와 동일한 ev.coverOverlay 데이터를 쓴다. */
  .cov-ov {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; padding: 7cqw 6cqw; pointer-events: none;
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .cov-ov.t-navy { background: linear-gradient(100deg, #16192A 0%, #16192A 56%, rgba(22,25,42,0) 74%); }
  .cov-ov.t-white { background: linear-gradient(100deg, #FFFFFF 0%, #FFFFFF 45%, rgba(255,255,255,0) 63%); }
  /* 로고와 간격을 두고 제목을 조금 아래로 내릴 때 쓴다. */
  .cov-ov.shift { justify-content: flex-end; padding-bottom: 7cqw; }
  .cov-ov .ov-logo { position: absolute; top: 6cqw; left: 6cqw; height: 5cqw; width: auto; display: block; }
  .cov-ov .ov-eyebrow {
    align-self: flex-start; background: #0B0D18; color: #fff; font-weight: 700;
    font-size: 2.5cqw; padding: 1.1cqw 2.3cqw; border-radius: 99px; margin-bottom: 2cqw;
    letter-spacing: -0.01em; white-space: nowrap;
  }
  .cov-ov .ov-line { font-weight: 700; letter-spacing: -0.02em; line-height: 1.18; margin: 0; white-space: pre; }
  .cov-ov .ov-line.sz-huge { font-size: 10.5cqw; }
  .cov-ov .ov-line.sz-title { font-size: 7.4cqw; }
  /* 긴 제목용. 우측 일러스트를 침범하지 않는 최대 크기다. */
  .cov-ov .ov-line.sz-mid { font-size: 5.8cqw; }
  .cov-ov .ov-line.sz-sub { font-size: 3.1cqw; font-weight: 600; margin-top: 1.4cqw; }
  .cov-ov.t-navy .ov-line { color: #fff; }
  .cov-ov.t-white .ov-line { color: var(--ink); }
  .cov-ov .ov-line.accent { color: var(--pink); }
  .sum .s-body { padding: 20px 22px 22px; }
  .sum h2 { margin: 0 0 14px; font-size: 16.5px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.45; }
  .sum .s-rows { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sum .s-row { display: flex; gap: 12px; font-size: 14px; }
  .sum .s-row .k { flex: none; width: 62px; color: var(--muted); }
  .sum .s-row .v { flex: 1; font-weight: 600; word-break: keep-all; }
  .sum .s-total { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sum .s-total .k { font-size: 14px; color: var(--muted); font-weight: 600; }
  /* 금액도 다른 요약 값과 같은 크기로. 여기서만 커지면 카드가 시끄럽다. */
  .sum .s-total .v { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .sum .s-note { margin: 12px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

  .notfound { text-align: center; padding: 90px 0 110px; }
  .notfound h1 { margin: 0 0 12px; font-size: 26px; }
  .notfound p { color: var(--muted); margin: 0 0 28px; }
  .notfound a {
    display: inline-block; padding: 14px 26px; font-size: 15px; font-weight: 700;
    color: #fff; background: var(--ink); border-radius: 12px; text-decoration: none;
  }

  @media (max-width: 1023px) {
    .layout { grid-template-columns: 1fr; gap: 30px; }
    .col { max-width: none; }
    /* 좁은 화면에서는 무엇을 신청하는지 먼저 보여 줍니다. */
    .rail { position: static; order: -1; }
    .sum { display: flex; align-items: stretch; }
    .sum .thumb-wrap { flex: none; width: 168px; }
    .sum img { width: 100%; height: 100%; aspect-ratio: 16 / 9; }
    .sum .s-body { flex: 1; min-width: 0; padding: 16px 18px; }
    .sum .s-rows, .sum h2 { margin-bottom: 0; }
    .sum .s-rows { display: none; }
    .sum .s-total { margin-top: 12px; padding-top: 12px; }
  }
  @media (max-width: 640px) {
    .row2 { grid-template-columns: 1fr; }
    .o-row { flex-direction: column; gap: 5px; }
    .o-row > span { width: auto; font-size: 13.5px; }
    .sum { display: block; }
    .sum .thumb-wrap { width: 100%; }
    .sum img { width: 100%; }
    .steps { gap: 7px; }
    .steps .st { font-size: 13.5px; }
  }

  footer {
    background: var(--fill);
    border-top: 1px solid var(--line);
    padding: 40px 0 44px;
    font-size: 14px;
    color: var(--muted);
  }
  .f-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .f-brand img { height: 22px; display: block; }
  .f-sns { display: flex; gap: 18px; }
  .f-sns a { color: var(--muted); text-decoration: none; font-weight: 500; }
  .f-sns a:hover { color: var(--ink); }
  .f-info { line-height: 1.8; }
  .f-info p { margin: 0; }
  .f-bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
</style>
</head>

<script>
/* GitHub Pages 는 정적 파일을 10분간 캐시하라고 응답합니다(max-age=600).
   주소 뒤에 5분 단위로 바뀌는 값을 붙여 그 창을 줄입니다.
   document.write 를 쓰는 이유는 아래 스크립트가 EVENTS_DB 를 곧바로 쓰기 때문입니다. */
document.write('<scr' + 'ipt src="assets/events.js?v=' + Math.floor(Date.now() / 300000) + '"></scr' + 'ipt>');
</script>
<script>
/* ===============================================
   신청 페이지

   상세 페이지의 '신청하기'를 누르면 여기로 옵니다.
   상세 안에 폼을 끼워 넣지 않고 페이지를 나눈 이유는,
   신청하는 동안에는 신청에만 집중하게 하기 위해서예요.

   제출은 Supabase로 곧장 갑니다. 중간 서버가 없습니다.
   아래 publishable 키는 공개용이라 이 파일에 있어도 됩니다.
   대신 테이블 권한이 유일한 방어선이라, anon 은 INSERT만 되고
   남의 신청을 읽는 건 DB에서 막혀 있습니다. (admin/supabase-schema.sql)
   =============================================== */
(function () {
  const id = new URLSearchParams(location.search).get("id");
  const ev = id && EVENTS_DB[id];
  const main = document.getElementById("main");
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  const notFound = (title, msg) => {
    main.innerHTML = '<div class="notfound"><h1>' + title + '</h1><p>' + msg + '</p>'
      + '<a href="courses.html">교육 일정 보러 가기</a></div>';
  };

  if (!ev) {
    notFound("찾을 수 없는 교육이에요", "주소가 바뀌었거나 이미 내려간 교육일 수 있어요.");
    return;
  }

  /* 지난 교육은 접수하지 않습니다. 상세 페이지에서도 막고 있지만,
     주소를 직접 치고 들어오는 경우가 있어서 여기서 한 번 더 봅니다. */
  if (ev.status === "replay" || ev.status === "replay-soon" || isEventOver(ev)) {
    notFound("접수가 끝난 교육이에요", "크래빗 아카데미에서 준비 중인 다른 교육을 둘러보세요.");
    return;
  }

  const fmt = eventFormat(ev);
  const price = eventPriceInfo(ev);
  const detailUrl = "event.html?id=" + encodeURIComponent(id);
  document.title = ev.title + " 신청 - 크래빗 아카데미";

  /* 라벨 앞에 붙는 2D 아이콘. 상세페이지와 같은 모양을 씁니다. */
  const IC = d => '<svg class="ic" width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">' + d + '</svg>';
  const S = 'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const ICONS = {
    user: IC('<circle cx="10" cy="6.8" r="3.1" ' + S + '/><path d="M3.6 17c0-3 2.9-5.2 6.4-5.2s6.4 2.2 6.4 5.2" ' + S + '/>'),
    phone: IC('<path d="M6.2 3.2h3l1.4 3.5-2 1.3a9.5 9.5 0 0 0 4.4 4.4l1.3-2 3.5 1.4v3a1.6 1.6 0 0 1-1.7 1.6C9.6 15.9 4.1 10.4 3.4 4.9a1.6 1.6 0 0 1 1.6-1.7z" ' + S + '/>'),
    mail: IC('<rect x="2.6" y="4.4" width="14.8" height="11.2" rx="2" ' + S + '/><path d="m3.2 5.6 6.8 4.9 6.8-4.9" ' + S + '/>'),
    home: IC('<path d="M3.2 8.6 10 3.2l6.8 5.4v7.2a1.4 1.4 0 0 1-1.4 1.4H4.6a1.4 1.4 0 0 1-1.4-1.4z" ' + S + '/>'),
    route: IC('<path d="M5.4 16.6V7.4M14.6 3.4v9.2" ' + S + '/><circle cx="5.4" cy="4.6" r="2" ' + S + '/><circle cx="14.6" cy="15.4" r="2" ' + S + '/>'),
    chat: IC('<path d="M17 11.4a2.6 2.6 0 0 1-2.6 2.6H7.2L3.6 17V5.4A2.6 2.6 0 0 1 6.2 2.8h8.2A2.6 2.6 0 0 1 17 5.4z" ' + S + '/>'),
    check: IC('<path d="M4 10.4 8.2 14.6 16.4 5.6" stroke="#FB75BB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>')
  };

  /* ---------- 진행 단계 ---------- */
  const stepBar = at => {
    const names = price.paid ? ["신청서 작성", "주문 확인", "결제"] : ["신청서 작성", "접수 완료"];
    return '<div class="steps">' + names.map((n, i) => {
      const cls = i < at ? "st done" : (i === at ? "st on" : "st");
      return '<div class="' + cls + '"><span class="n">' + (i < at ? "✓" : (i + 1)) + '</span>' + n + '</div>'
        + (i < names.length - 1 ? '<span class="arw">→</span>' : '');
    }).join("") + '</div>';
  };

  /* ---------- 오른쪽 주문 요약 ---------- */
  const sumRows = [{ k: "진행 방식", v: esc(fmt.label) }, { k: "일정", v: esc(ev.date) }]
    .concat(ev.materials ? [{ k: "제공 자료", v: ev.materials.length + "종" }] : []);

  /* 썸네일 위 실제 글자 오버레이. event.html의 같은 장치와 동일한 데이터를 쓴다. */
  const coverOverlayHtml = ov => {
    if (!ov) return "";
    const lines = (ov.lines || []).map(l =>
      '<p class="ov-line sz-' + (l.size || "title") + (l.accent ? " accent" : "") + '">' + esc(l.text) + '</p>'
    ).join("");
    return '<div class="cov-ov t-' + (ov.theme || "navy") + (ov.shift ? ' shift' : '') + '">'
      + (ov.logo ? '<img class="ov-logo" src="' + ov.logo + '" alt="" />' : '')
      + (ov.eyebrow ? '<span class="ov-eyebrow">' + esc(ov.eyebrow) + '</span>' : '')
      + lines
      + '</div>';
  };

  const railHtml = '<aside class="rail"><div class="sum">'
    + '<div class="thumb-wrap"><img src="' + ev.thumb + '" alt="' + esc(ev.title) + ' 썸네일" />'
    + coverOverlayHtml(ev.coverOverlay) + '</div>'
    + '<div class="s-body">'
    + '<h2>' + esc(ev.title) + '</h2>'
    + '<div class="s-rows">'
    + sumRows.map(r => '<div class="s-row"><span class="k">' + r.k + '</span><span class="v">' + r.v + '</span></div>').join("")
    + '</div>'
    + (price.incomplete ? '' :
        '<div class="s-total"><span class="k">' + (price.paid ? "수강료" : "참가비") + '</span>'
        + '<span class="v">' + esc(price.text) + '</span></div>'
        + (price.note ? '<p class="s-note">' + esc(price.note) + '</p>' : ''))
    + '</div></div></aside>';

  /* ---------- 화면 ---------- */
  const fld = (icon, label, req, inner) =>
    '<div><label for="' + req.id + '">' + icon + label
    + (req.must ? '<span class="req">*</span>' : '') + '</label>' + inner + '</div>';

  const formHtml = '<div class="col">'
    + stepBar(0)
    + '<h1 class="sec-h">신청하기</h1>'
    + '<p class="form-sub">아래 내용을 남겨 주시면 접수됩니다.'
    + (fmt.isOnline ? ' 줌 참여 링크는 행사 당일 오전에 보내드려요.' : '')
    + (price.paid ? ' 제출을 마치면 결제 화면으로 이어집니다.' : '')
    + '</p>'
    + '<form id="applyFormEl" novalidate><div class="fields">'
    + '<div class="row2">'
    + fld(ICONS.user, "이름", { id: "f-name", must: true },
        '<input type="text" id="f-name" name="name" autocomplete="name" maxlength="40" required />')
    + fld(ICONS.phone, "연락처", { id: "f-phone", must: true },
        '<input type="tel" id="f-phone" name="phone" autocomplete="tel" placeholder="010-0000-0000" maxlength="20" required />')
    + '</div>'
    + '<div class="row2">'
    + fld(ICONS.mail, "이메일", { id: "f-email", must: true },
        '<input type="email" id="f-email" name="email" autocomplete="email" maxlength="120" required />')
    + fld(ICONS.home, "학원명과 직책", { id: "f-org", must: true },
        '<input type="text" id="f-org" name="org" placeholder="예: 크래빗학원 원장" maxlength="120" required />')
    + '</div>'
    + fld(ICONS.route, "유입 경로", { id: "f-source-btn" },
        '<div class="dd" id="dd-source">'
        + '<button type="button" class="dd-btn" id="f-source-btn" aria-haspopup="listbox" aria-expanded="false">'
        + '<span class="dd-val placeholder">선택해 주세요</span>'
        + '<svg class="caret" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '</button>'
        + '<ul class="dd-menu" role="listbox" hidden>'
        + ["크래빗 장학카드 사용 중인 학원", "올커니 멤버", "지인 소개", "인스타그램 및 기타 SNS", "직접 입력"]
            .map(v => '<li role="option" data-v="' + v + '">' + v + '</li>').join("")
        + '</ul>'
        + '<input type="hidden" id="f-source" name="source" value="" />'
        + '</div>'
        + '<input type="text" id="f-source-custom" name="sourceCustom" placeholder="어떻게 알고 오셨는지 적어 주세요" maxlength="120" style="display:none; margin-top:10px;" />')
    + fld(ICONS.chat, "문의사항", { id: "f-message" },
        '<textarea id="f-message" name="message" maxlength="1000" placeholder="미리 궁금하신 점이 있으면 남겨 주세요."></textarea>')
    /* 사람에게는 안 보이는 칸. 자동 프로그램이 채우면 접수하지 않습니다. */
    + '<div class="hp" aria-hidden="true"><label for="f-website">website</label>'
    + '<input type="text" id="f-website" name="website" tabindex="-1" autocomplete="off" /></div>'
    + '<div class="consent">'
    + '<div class="consent-row">'
    + '<input type="checkbox" id="f-consent" name="consent" required />'
    + '<label for="f-consent">개인정보 수집과 이용에 동의합니다<span class="req">*</span></label>'
    + '</div>'
    + '<p class="consent-detail">수집 항목은 이름, 연락처, 이메일, 소속입니다. '
    + '강의 접수와 안내 목적으로만 쓰고 강의 종료 후 1년간 보관한 뒤 파기합니다. '
    + '동의하지 않으셔도 되지만 그 경우 신청 접수가 어렵습니다.</p>'
    + '</div>'
    + '</div>'
    + '<div class="submit-row"><button class="submit" type="submit">신청 접수하기</button></div>'
    + '<p class="formmsg" id="formMsg" hidden></p>'
    + '</form></div>';

  main.innerHTML = '<a class="back" href="' + detailUrl + '">&larr; 강의 상세로 돌아가기</a>'
    + '<div class="layout" id="layout">' + formHtml + railHtml + '</div>';

  const SB_URL = "https://ttolvlzubashyhdctbqr.supabase.co";
  const SB_KEY = "sb_publishable_BLr1R3be079ViSLSoAtIqQ_ZTs7T6HG";
  const APPLY_API = SB_URL + "/rest/v1/academy_applications";

  const formEl = document.getElementById("applyFormEl");

  /* 유입 경로 자체 드롭다운. '직접 입력'을 고르면 그때만 입력칸을 연다. */
  const dd = document.getElementById("dd-source");
  if (dd) {
    const btn = dd.querySelector(".dd-btn");
    const menu = dd.querySelector(".dd-menu");
    const valEl = dd.querySelector(".dd-val");
    const hidden = document.getElementById("f-source");
    const srcCustom = document.getElementById("f-source-custom");
    const setOpen = open => {
      dd.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      menu.hidden = !open;
    };
    btn.addEventListener("click", () => setOpen(menu.hidden));
    menu.addEventListener("click", e => {
      const li = e.target.closest("li[data-v]");
      if (!li) return;
      hidden.value = li.dataset.v;
      valEl.textContent = li.dataset.v;
      valEl.classList.remove("placeholder");
      menu.querySelectorAll("li").forEach(x => x.setAttribute("aria-selected", x === li ? "true" : "false"));
      setOpen(false);
      const custom = li.dataset.v === "직접 입력";
      srcCustom.style.display = custom ? "block" : "none";
      if (custom) srcCustom.focus();
    });
    document.addEventListener("click", e => { if (!dd.contains(e.target)) setOpen(false); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") setOpen(false); });
  }
  const msg = document.getElementById("formMsg");
  const btn = formEl.querySelector("button.submit");

  const show = (text, isError) => {
    msg.textContent = text;
    msg.className = "formmsg" + (isError ? " err" : "");
    msg.hidden = false;
  };

  /* 무료 강의 완료 안내 */
  const doneHtml = () => '<div class="col">'
    + stepBar(1)
    + '<div class="done">'
    + '<div class="mark">' + ICONS.check + '</div>'
    + '<h3>신청이 접수되었습니다</h3>'
    + '<p>' + (fmt.isOnline
        ? '행사 당일 오전에 줌 참여 링크를 보내드릴게요.'
        : '남겨 주신 연락처로 확정 안내를 보내드릴게요.') + '</p>'
    + '<a class="btn-back" href="' + detailUrl + '">강의 상세로 돌아가기</a>'
    + '</div></div>';

  /* 유료 강의 주문 확인과 결제.
     결제하기를 누르면 결제 함수(pay/ready)가 카카오페이 결제창 주소를
     만들어 주고, 그 주소로 이동합니다. 인증을 마치면 pay/complete.html 로
     돌아와 승인이 확정됩니다. */
  const orderHtml = name => '<div class="col order">'
    + stepBar(1)
    + '<h1 class="sec-h">주문 확인</h1>'
    + '<p class="o-sub">' + esc(name) + '님, 아래 내용으로 결제를 진행합니다.</p>'
    + '<div class="o-box">'
    + '<div class="o-row"><span>강의</span><b>' + esc(ev.title) + '</b></div>'
    + '<div class="o-row"><span>진행 방식</span><b>' + esc(fmt.label) + '</b></div>'
    + (ev.provision ? '<div class="o-row"><span>서비스 제공</span><b>' + esc(ev.provision) + '</b></div>' : '')
    + '<div class="o-row total"><span>결제 금액</span><b>' + esc(price.text) + '</b></div>'
    + '</div>'
    + '<h4 class="o-h">결제 수단</h4>'
    + '<label class="o-pay"><input type="radio" name="paymethod" value="kakaopay" checked />'
    + '<span>카카오페이</span></label>'
    + '<label class="o-agree"><input type="checkbox" id="o-agree" />'
    + '<span>주문 내용을 확인했으며 <a href="policy.html" target="_blank" rel="noopener">이용약관과 환불 규정</a>에 동의합니다.</span></label>'
    + '<p class="o-msg" id="oMsg" hidden></p>'
    + '<button class="submit" id="payBtn" type="button">결제하기</button>'
    + '</div>';

  /* 결제하기 버튼 동작. 결제 백엔드는 신청 테이블과 다른 Supabase 프로젝트
     (crabit-academy-payments)에 있습니다. 돈이 오가는 일이라 따로 뗐습니다.
     금액은 보내지 않습니다. 서버가 products 표에서 직접 읽기 때문에
     브라우저에서 무엇을 보내든 금액을 바꿀 수 없습니다. */
  const PAY_API = "https://iwitqfnhlyseuxxndvny.supabase.co/functions/v1/pay";
  let submitted = null;
  function bindOrder() {
    const payBtn = document.getElementById("payBtn");
    const agree = document.getElementById("o-agree");
    const oMsg = document.getElementById("oMsg");
    if (!payBtn) return;
    const say = (text, isError) => {
      oMsg.textContent = text;
      oMsg.className = "o-msg" + (isError ? " err" : "");
      oMsg.hidden = false;
    };
    payBtn.addEventListener("click", async () => {
      if (!agree.checked) { say("이용약관과 환불 규정에 동의해 주세요.", true); return; }
      payBtn.disabled = true;
      say("카카오페이로 연결하는 중이에요…", false);
      try {
        const res = await fetch(PAY_API + "/ready", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            event_id: id,
            name: submitted.name,
            phone: submitted.phone,
            email: submitted.email,
            org: submitted.org
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.redirect_pc) {
          say((data && data.error) || "카카오페이 연결에 실패했어요. 잠시 후 다시 시도해 주세요.", true);
          payBtn.disabled = false;
          return;
        }
        /* 휴대폰은 카카오톡으로 바로 이어지는 모바일 주소로,
           컴퓨터는 QR이 뜨는 PC 주소로 보냅니다. */
        const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        location.href = mobile ? data.redirect_mobile : data.redirect_pc;
      } catch {
        say("네트워크 문제로 연결하지 못했어요. 잠시 후 다시 시도해 주세요.", true);
        payBtn.disabled = false;
      }
    });
  }

  formEl.addEventListener("submit", async e => {
    e.preventDefault();
    const val = n => (formEl.elements[n] ? formEl.elements[n].value.trim() : "");

    if (!val("name")) { show("이름을 입력해 주세요.", true); formEl.elements.name.focus(); return; }
    const digits = val("phone").replace(/[^0-9]/g, "");
    if (digits.length < 9 || digits.length > 11) {
      show("연락처를 다시 확인해 주세요.", true); formEl.elements.phone.focus(); return;
    }
    /* 이메일과 학원명도 필수. 참여 링크와 자료를 이메일로 보내고,
       같은 학원에서 여러 명이 신청할 때 학원명으로 구분하기 때문입니다. */
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val("email"))) {
      show("이메일을 다시 확인해 주세요.", true); formEl.elements.email.focus(); return;
    }
    if (!val("org")) { show("학원명과 직책을 입력해 주세요.", true); formEl.elements.org.focus(); return; }
    if (!formEl.elements.consent.checked) {
      show("개인정보 수집과 이용에 동의해 주셔야 신청할 수 있어요.", true); return;
    }

    /* 사람 눈에 안 보이는 칸이 채워져 있으면 자동 프로그램입니다.
       조용히 성공한 척하고 보내지 않습니다. */
    if (val("website")) {
      show("신청이 접수되었습니다.", false);
      return;
    }

    btn.disabled = true;
    show("접수하는 중이에요…", false);

    /* 빈 칸은 아예 빼고 보냅니다. 빈 문자열이 들어가면 길이 제약에 걸릴 수 있습니다. */
    const row = {
      event_id: id,
      event_title: ev.title,
      event_fee: price.text || null,
      event_price: price.amount,
      name: val("name"),
      phone: digits,
      email: val("email"),
      org: val("org"),
      source: (val("source") === "직접 입력" ? (val("sourceCustom") || "직접 입력") : val("source")) || null,
      message: val("message") || null,
      consent: true
    };
    /* 결제 단계에서 쓸 신청자 정보. 폼이 화면에서 사라진 뒤에도 필요합니다. */
    submitted = row;

    try {
      const res = await fetch(APPLY_API, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SB_KEY,
          "Authorization": "Bearer " + SB_KEY,
          /* 넣기만 하고 돌려받지 않습니다. anon 은 읽기 권한이 없으므로
             return=representation 을 쓰면 오히려 실패합니다. */
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(row)
      });

      if (!res.ok) {
        /* 23505 는 유니크 위반. 같은 강의에 같은 번호로 이미 넣은 경우입니다. */
        const err = await res.json().catch(() => ({}));
        const dup = res.status === 409 || err.code === "23505";
        show(dup
          ? "이미 같은 연락처로 신청이 접수돼 있어요. 확인이 필요하시면 문의해 주세요."
          : "접수에 실패했어요. 잠시 후 다시 시도해 주세요.", true);
        btn.disabled = false;
        return;
      }

      /* 성공하면 왼쪽 칸을 다음 단계로 바꿉니다.
         유료 강의는 주문 확인과 결제로, 무료 강의는 완료 안내로 갑니다.
         오른쪽 주문 요약은 그대로 두어 무엇을 신청했는지 계속 보이게 합니다. */
      const layout = document.getElementById("layout");
      layout.querySelector(".col").outerHTML = price.paid ? orderHtml(val("name")) : doneHtml();
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (price.paid) bindOrder();
    } catch {
      show("네트워크 문제로 접수하지 못했어요. 잠시 후 다시 시도해 주세요.", true);
      btn.disabled = false;
    }
  });
})();
</script>
