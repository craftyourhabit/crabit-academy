    <rect x="-160" y="-32" width="66" height="64" rx="16" fill="#FFFFFF" stroke="#E6E7EC" stroke-width="2"/>
    <path d="M-104 -44 L62 -116 L62 116 L-104 44 Z" fill="#FFFFFF" stroke="#E6E7EC" stroke-width="2" stroke-linejoin="round"/>
